version: '3.8'

services:
  subfluxgpt:
    build: .
    container_name: subfluxgpt
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./.env:/app/.env:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - NETLAS_API_KEY=${NETLAS_API_KEY}
      - BBRF_SERVER=${BBRF_SERVER}
      - BBRF_USERNAME=${BBRF_USERNAME}
      - BBRF_PASSWORD=${BBRF_PASSWORD}
    stdin_open: true
    tty: true
