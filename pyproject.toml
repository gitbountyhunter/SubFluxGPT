[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subfluxgpt"
version = "1.0.0"
description = "Next-generation AI-powered subdomain enumeration for bug bounty hunters"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["subdomain", "enumeration", "bug-bounty", "security", "reconnaissance", "ai", "gemini", "claude", "netlas", "bbrf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "google-generativeai>=0.3.0",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",
    "dnspython>=2.4.0",
    "tldextract>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
subfluxgpt = "subfluxgpt.cli:cli_entry"

[project.urls]
Homepage = "https://github.com/yourusername/SubFluxGPT"
Bug-Reports = "https://github.com/yourusername/SubFluxGPT/issues"
Source = "https://github.com/yourusername/SubFluxGPT"
Documentation = "https://github.com/yourusername/SubFluxGPT/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
